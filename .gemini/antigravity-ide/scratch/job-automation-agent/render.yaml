services:
  # Backend FastAPI Web Service
  - type: web
    name: job-agent-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python -m app.seed"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_SECRET_KEY
        value: "yB14Y5c0Z57y5Kq_ZzU93B2F0Jp7W5xY1mZ6g5k4a2c="
      - key: DATABASE_URL
        value: "sqlite:///./job_agent.db"
      - key: CORS_ORIGINS
        value: '["*"]'

  # Frontend Static Site
  - type: web
    name: job-agent-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://job-agent-backend.onrender.com/api/v1"
